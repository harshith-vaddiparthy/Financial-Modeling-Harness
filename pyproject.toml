[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-modeling-harness"
version = "1.0.0"
description = "Auditable financial projections and agent tools for Hermes"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
finance-harness = "harness.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["report.html"]
